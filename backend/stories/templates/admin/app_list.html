{% load i18n %}

{% for app in app_list %}
    <div class="app-{{ app.app_label }} module">
        <table>
            <caption>
                <a href="{{ app.app_url }}" class="section">
                    {{ app.name }}
                </a>
            </caption>

            {% for model in app.models %}
                <tr class="model-{{ model.object_name|lower }}">
                    <th scope="row">
                        <a href="{{ model.admin_url }}">
                            {{ model.name }}
                        </a>
                    </th>

                    <td>
                        {% if model.object_name == "Story" %}
                            <a
                                href="{% url 'admin:stories_story_generate' %}"
                                class="addlink"
                            >
                                Generate
                            </a>
                        {% elif model.add_url %}
                            <a href="{{ model.add_url }}" class="addlink">
                                Add
                            </a>
                        {% endif %}
                    </td>

                    <td>
                        {% if model.admin_url %}
                            <a href="{{ model.admin_url }}" class="changelink">
                                Change
                            </a>
                        {% endif %}
                    </td>
                </tr>
            {% endfor %}
        </table>
    </div>
{% endfor %}
