{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up | Reel News</title>
    <link rel="stylesheet" href="{% static 'stories/css/global.css' %}">
    <link rel="stylesheet" href="{% static 'stories/css/auth.css' %}">
</head>
<body class="auth-page">
    <main class="auth-card">
        <h1>Sign up</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Create account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
        <p class="auth-switch"><a href="{% url 'feed' %}">← Back to feed</a></p>
    </main>
</body>
</html>
